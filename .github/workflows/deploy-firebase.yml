name: Deploy Chassis Firebase services

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_FIREBASE_DEPLOYER_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chassis
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Check federated credentials and Firebase project access
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          token="$(gcloud auth print-access-token)"
          status="$(curl --silent --show-error --output /tmp/chassis-firebase-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${token}" \
            "https://firebase.googleapis.com/v1beta1/projects/${FIREBASE_PROJECT_ID}")"
          unset token
          if [ "${status}" != "200" ]; then
            python3 -c 'import json,sys; e=json.load(open("/tmp/chassis-firebase-project.json")).get("error",{}); print(f"Firebase project check returned HTTP {sys.argv[1]}: {e.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115), "UNKNOWN")} — {e.get(chr(109)+chr(101)+chr(115)+chr(115)+chr(97)+chr(103)+chr(101), "No error details")}")' "${status}"
            exit 1
          fi
          echo "Federated access works and Firebase recognizes the project."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and function dependencies
        run: |
          npm install --global firebase-tools
          firebase --version
          npm install --prefix functions --omit=dev

      - name: Deploy Firebase rules and functions
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only functions,firestore:rules,storage --non-interactive --project "$FIREBASE_PROJECT_ID"
