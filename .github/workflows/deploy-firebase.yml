name: Deploy Chassis Firebase services

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_FIREBASE_DEPLOYER_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chassis
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and function dependencies
        run: |
          npm install --global firebase-tools
          npm install --prefix functions --omit=dev

      - name: Deploy Firebase rules and functions
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only functions,firestore:rules,storage --non-interactive --project "$FIREBASE_PROJECT_ID"
