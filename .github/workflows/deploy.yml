name: Publish Velocitrak to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare optional restricted YouTube browser key
        env:
          CHASSIS_YOUTUBE_BROWSER_KEY: ${{ secrets.YOUTUBE_BROWSER_API_KEY }}
        run: |
          node --input-type=module -e 'import { writeFile } from "node:fs/promises"; const key = process.env.CHASSIS_YOUTUBE_BROWSER_KEY || ""; await writeFile("youtube-config.js", `window.CHASSIS_YOUTUBE_API_KEY = ${JSON.stringify(key)};\n`);'
          if [ -n "$CHASSIS_YOUTUBE_BROWSER_KEY" ]; then
            echo "A site-wide YouTube browser key was supplied to the build."
          else
            echo "::warning::YOUTUBE_BROWSER_API_KEY is not configured; the site will show branded search-preview cards and creator search links."
          fi
      - name: Verify the YouTube key against the allowed site referrer
        env:
          CHASSIS_YOUTUBE_BROWSER_KEY: ${{ secrets.YOUTUBE_BROWSER_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.CHASSIS_YOUTUBE_BROWSER_KEY || "";
          if (!key) process.exit(0);
          const url = new URL("https://www.googleapis.com/youtube/v3/channels");
          url.searchParams.set("part", "id");
          url.searchParams.set("forHandle", "FasBeam");
          url.searchParams.set("maxResults", "1");
          url.searchParams.set("key", key);
          try {
            const response = await fetch(url, { headers: { Referer: "https://v8sl-grg.github.io/" } });
            const data = await response.json();
            if (!response.ok || !data.items?.length) {
              const reason = data.error?.errors?.[0]?.reason || "unknown";
              console.log(`::warning::YouTube key check failed (HTTP ${response.status}, ${reason}). Check API enablement, key restrictions and quota.`);
            } else {
              console.log("YouTube Data API key check succeeded for the Velocitrak site referrer.");
            }
          } catch (error) {
            console.log(`::warning::YouTube key check could not reach Google: ${error.message}`);
          }
          NODE
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4

