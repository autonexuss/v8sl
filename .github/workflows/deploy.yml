name: Publish Chassis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare optional restricted YouTube browser key
        env:
          CHASSIS_YOUTUBE_BROWSER_KEY: ${{ secrets.YOUTUBE_BROWSER_API_KEY }}
        run: |
          node --input-type=module -e 'import { writeFile } from "node:fs/promises"; const key = process.env.CHASSIS_YOUTUBE_BROWSER_KEY || ""; await writeFile("youtube-config.js", `window.CHASSIS_YOUTUBE_API_KEY = ${JSON.stringify(key)};\n`);'
          if [ -n "$CHASSIS_YOUTUBE_BROWSER_KEY" ]; then
            echo "A site-wide YouTube browser key was supplied to the build."
          else
            echo "::warning::YOUTUBE_BROWSER_API_KEY is not configured; direct video results and thumbnails will fall back to creator search links."
          fi
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4

