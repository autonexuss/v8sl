.anx-sim {
  /* ---- design tokens (override on the host element) ---- */
  --anx-bg: #000000; --anx-panel: #050505; --anx-panel-2: #0a0a0a; --anx-line: #282828; --anx-line-2: #393939;
  --anx-text: #ededed; --anx-muted: #a6a6a6; --anx-dim: #777777;
  --anx-accent: #ae2530; --anx-green: #35e08a; --anx-amber: #ffb23e; --anx-red: #ff4d5a;
  --anx-vp0: #050505; --anx-vp1: #000000;                    /* 3D viewport background (centre / edge) */
  --anx-radius: 10px; --anx-height: 880px;                    /* desktop layout height; use 100vh for full page */
  --anx-font-ui: "Autonexus Inter", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  position: relative; display: block; width: 100%; container: anx / inline-size;
  background: var(--anx-bg); color: var(--anx-text); font: 400 13px/1.45 var(--anx-font-ui);
  -webkit-font-smoothing: antialiased; text-align: left; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums;
}
.anx-sim *, .anx-sim *::before, .anx-sim *::after { box-sizing: border-box; }
.anx-sim [hidden] { display: none !important; }
.anx-sim :is(h3, p, dl, dd, ul, li, small, em, b, i, label, button, input, select, summary, canvas, dialog) { margin: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: none; }
.anx-sim :is(b) { font-weight: 600; }
.anx-sim em, .anx-sim i { font-style: normal; }
.anx-sim ul { list-style: none; }
.anx-sim kbd { font: 600 10px/1 var(--anx-font-ui); padding: 3px 5px; border-radius: 4px; background: var(--anx-panel-2); border: 1px solid var(--anx-line-2); color: var(--anx-muted); }
:fullscreen.anx-sim, .anx-sim:fullscreen { --anx-height: 100vh; }

/* ---------------------------------------------------------------- layout */
.anx-app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: var(--anx-height); min-height: 720px; overflow: hidden; background: var(--anx-bg); }
.anx-body { display: grid; grid-template-columns: 300px minmax(0, 1fr) 336px; min-height: 0; border-top: 1px solid var(--anx-line); }
.anx-side { background: var(--anx-panel); overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--anx-line-2) transparent; }
.anx-left { border-right: 1px solid var(--anx-line); }
.anx-right { border-left: 1px solid var(--anx-line); }
.anx-center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--anx-bg); }

/* ---------------------------------------------------------------- header */
.anx-head { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: linear-gradient(180deg, #050505, var(--anx-panel)); flex-wrap: wrap; }
.anx-brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
.anx-brand-logo { display: block; width: 178px; max-width: 100%; height: auto; max-height: 36px; object-fit: contain; filter: brightness(0) invert(1); flex: none; }
.anx-brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.anx-brand-name { font-weight: 700; font-size: 15px; letter-spacing: .22em; color: var(--anx-text); }
.anx-brand-sub { font-weight: 600; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--anx-accent); margin-top: 3px; }
.anx-status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--anx-line-2); border-radius: 999px; background: var(--anx-panel-2); font-weight: 600; font-size: 12px; color: var(--anx-muted); max-width: 260px; }
.anx-status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.anx-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--anx-dim); flex: none; }
.anx-status[data-s="run"] { color: var(--anx-green); border-color: rgba(53, 224, 138, .4); }
.anx-status[data-s="run"] .anx-dot { background: var(--anx-green); box-shadow: 0 0 10px var(--anx-green); animation: anx-pulse 1.6s ease-in-out infinite; }
.anx-status[data-s="crank"] { color: var(--anx-amber); border-color: rgba(255, 178, 62, .4); }
.anx-status[data-s="crank"] .anx-dot { background: var(--anx-amber); animation: anx-pulse .5s ease-in-out infinite; }
.anx-status[data-s="fail"] { color: var(--anx-red); border-color: rgba(255, 77, 90, .45); }
.anx-status[data-s="fail"] .anx-dot { background: var(--anx-red); }
@keyframes anx-pulse { 50% { opacity: .35; } }
.anx-actions { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }

/* --------------------------------------------------------------- buttons */
.anx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--anx-line-2); background: var(--anx-panel-2); color: var(--anx-text);
  font-weight: 600; font-size: 12px; letter-spacing: .04em; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: border-color .15s, background .15s, transform .08s, box-shadow .15s; }
.anx-btn:hover { border-color: var(--anx-accent); background: #171717; }

.anx-btn:disabled { opacity: .5; cursor: default; }
.anx-btn svg, .anx-sim .anx-pedal svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.anx-ico { width: 34px; padding: 0; }
.anx-sm { width: 28px; height: 28px; font-size: 10px; border-radius: 7px; }
.anx-sm svg { width: 14px; height: 14px; }
.anx-block { width: 100%; margin-top: 8px; }
.anx-go { background: linear-gradient(180deg, #14503a, #0e3a2a); border-color: rgba(53, 224, 138, .55); color: #b6ffd9; }
.anx-go:hover { border-color: var(--anx-green); background: linear-gradient(180deg, #186049, #11452f); box-shadow: 0 0 0 3px rgba(53, 224, 138, .12); }

.anx-stop:hover { border-color: var(--anx-red); background: #290b10; }
.anx-reset:hover { border-color: var(--anx-amber); color: var(--anx-amber); }
.anx-primary { background: linear-gradient(180deg, #893339, #8b3238); border-color: rgba(202, 38, 49, .55); color: #e5d1d2; }
.anx-btn:focus-visible, .anx-chip:focus-visible, .anx-segb:focus-visible, .anx-pedal:focus-visible, .anx-toggle:focus-visible, .anx-link:focus-visible, .anx-select:focus-visible, .anx-range:focus-visible, .anx-sec > summary:focus-visible {
  outline: 2px solid var(--anx-accent); outline-offset: 2px; }
.anx-btn[aria-pressed="true"].anx-sm, .anx-btn.is-on { border-color: var(--anx-accent); color: var(--anx-accent); }

/* ------------------------------------------------------------- sidebars */
.anx-sec { border-bottom: 1px solid var(--anx-line); }
.anx-sec > summary { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; list-style: none; font-weight: 700; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--anx-accent); user-select: none; }
.anx-sec > summary::-webkit-details-marker { display: none; }
.anx-sec > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--anx-dim); border-bottom: 2px solid var(--anx-dim); transform: rotate(45deg); transition: transform .2s; margin-right: 3px; }
.anx-sec[open] > summary::after { transform: rotate(-135deg); }
.anx-sec-body { padding: 0 16px 16px; }
.anx-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 10px; color: var(--anx-muted); }
.anx-row b, .anx-row b + * { color: var(--anx-text); }
.anx-lbl, .anx-row label { color: var(--anx-muted); font-size: 12px; }
.anx-row b { font-weight: 600; font-size: 13px; }
.anx-select { width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--anx-line-2); background: var(--anx-panel-2); color: var(--anx-text); cursor: pointer; font-size: 13px; min-width: 0; }
.anx-engsel { display: flex; gap: 6px; }
.anx-blurb { margin-top: 10px; color: var(--anx-muted); font-size: 12px; line-height: 1.5; }
.anx-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.anx-tile { padding: 9px 10px; border: 1px solid var(--anx-line); border-radius: 9px; background: linear-gradient(180deg, var(--anx-panel-2), var(--anx-panel)); min-width: 0; }
.anx-tile span { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--anx-dim); font-weight: 600; }
.anx-tile b { display: block; margin-top: 2px; font-size: 15px; font-weight: 700; white-space: nowrap; }

.anx-bar { height: 8px; margin-top: 8px; border-radius: 4px; background: var(--anx-line); overflow: hidden; }
.anx-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8f2d34, var(--anx-accent)); border-radius: 4px; transition: width .3s; }
.anx-bar i.is-low { background: var(--anx-red); }

.anx-presets { display: flex; gap: 5px; margin-top: 8px; }
.anx-chip { flex: 1; height: 26px; border-radius: 7px; border: 1px solid var(--anx-line-2); background: var(--anx-panel-2); color: var(--anx-muted); font-weight: 600; font-size: 11px; cursor: pointer; padding: 0 4px; }
.anx-chip:hover { border-color: var(--anx-accent); color: var(--anx-text); }
.anx-chip.is-on { border-color: var(--anx-accent); color: var(--anx-accent); background: rgba(202, 38, 49, .1); }
.anx-zone { margin-top: 8px; font-weight: 600; font-size: 12px; color: var(--anx-green); }
.anx-zone[data-z="cold"] { color: var(--anx-accent); } .anx-zone[data-z="hot"] { color: var(--anx-amber); }
.anx-seg { display: flex; margin-top: 6px; border: 1px solid var(--anx-line-2); border-radius: 8px; overflow: hidden; background: var(--anx-panel-2); }
.anx-segb { flex: 1; height: 28px; border: 0; border-right: 1px solid var(--anx-line); background: transparent; color: var(--anx-muted); font-weight: 600; font-size: 11px; cursor: pointer; padding: 0 2px; }

/* ----------------------------------------------------------------- range */
.anx-range { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 4px 0 0; background: transparent; cursor: pointer; --p: 0%; --c: var(--anx-accent); touch-action: pan-y; }

.anx-range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--c); }
.anx-range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: #fff; border: 3px solid var(--anx-bg); box-shadow: 0 0 0 1.5px var(--c); }
.anx-range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--anx-bg); box-shadow: 0 0 0 1.5px var(--c); }
.anx-range--temp::-webkit-slider-runnable-track { background: linear-gradient(90deg, #c62630, var(--anx-accent) 28%, var(--anx-green) 50%, var(--anx-amber) 80%, var(--anx-red)); }
.anx-range--temp::-moz-range-track { background: linear-gradient(90deg, #c62630, var(--anx-accent) 28%, var(--anx-green) 50%, var(--anx-amber) 80%, var(--anx-red)); }
.anx-range--big { height: 34px; }
.anx-range--big::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--anx-accent) var(--p), var(--anx-line-2) var(--p)); }
.anx-range--big::-moz-range-track, .anx-range--big::-moz-range-progress { height: 14px; border-radius: 7px; }
.anx-range--big::-webkit-slider-thumb { width: 28px; height: 28px; margin-top: -7px; border-width: 4px; }
.anx-range--big::-moz-range-thumb { width: 22px; height: 22px; border-width: 4px; }
.anx-range--load { --c: var(--anx-amber); }

/* -------------------------------------------------------------- viewport */
.anx-viewport { position: relative; flex: 1 1 auto; min-height: 280px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, var(--anx-vp0), var(--anx-vp1) 75%); }
.anx-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.anx-gl:active { cursor: grabbing; }
.anx-vp-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; }
.anx-vp-top > * { pointer-events: auto; }
.anx-engchip { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 8px; border-radius: 12px; background: rgba(23, 12, 12, .72); border: 1px solid var(--anx-line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: 46%; }
.anx-badge { display: grid; place-items: center; min-width: 42px; height: 30px; padding: 0 8px; border-radius: 8px; background: rgba(202, 38, 49, .14); border: 1px solid rgba(202, 38, 49, .45); color: var(--anx-accent); font-weight: 700; font-size: 13px; letter-spacing: .04em; }
.anx-engchip-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.anx-engchip-t b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.anx-engchip-t small { font-size: 11px; color: var(--anx-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.anx-shift { display: flex; gap: 3px; padding: 8px 10px; border-radius: 10px; background: rgba(23, 12, 12, .6); border: 1px solid var(--anx-line); pointer-events: none !important; }
.anx-shift i { width: 9px; height: 9px; border-radius: 50%; background: #2b0d12; transition: background .06s, box-shadow .06s; }
.anx-shift i.on.g { background: var(--anx-green); box-shadow: 0 0 8px var(--anx-green); }
.anx-shift i.on.a { background: var(--anx-amber); box-shadow: 0 0 8px var(--anx-amber); }
.anx-shift i.on.r { background: var(--anx-red); box-shadow: 0 0 9px var(--anx-red); }
.anx-viewtools { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(23, 12, 12, .72); border: 1px solid var(--anx-line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.anx-vp-bot { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; pointer-events: none; flex-wrap: wrap; }
.anx-vp-bot > * { pointer-events: auto; }
.anx-strokes { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--anx-line); background: rgba(23, 12, 12, .72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.anx-strokes span { padding: 6px 10px; font-weight: 600; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--anx-dim); border-right: 1px solid var(--anx-line); transition: background .08s, color .08s; }
.anx-strokes span:last-child { border-right: 0; }
.anx-strokes span.is-on { background: rgba(202, 38, 49, .18); color: var(--anx-accent); }
.anx-strokes span:nth-child(3).is-on { background: rgba(255, 106, 77, .2); color: #ff8a6b; }
.anx-slow { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; border-radius: 10px; border: 1px solid var(--anx-line); background: rgba(23, 12, 12, .72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.anx-slow span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--anx-dim); font-weight: 600; margin-right: 4px; }
.anx-slow .anx-chip { flex: none; height: 24px; padding: 0 8px; }
.anx-overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 70px 16px; background: radial-gradient(ellipse at center, rgba(12, 6, 6, .35), rgba(12, 6, 6, .72)); z-index: 3; }
.anx-card { max-width: 380px; padding: 22px 24px; border-radius: 16px; background: rgba(26, 15, 15, .88); border: 1px solid var(--anx-line-2); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); text-align: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.anx-card h3 { font-size: 22px; font-weight: 700; margin-top: 4px; }
.anx-card p { margin-top: 8px; color: var(--anx-muted); font-size: 13px; line-height: 1.55; }
.anx-card small { display: block; margin-top: 12px; color: var(--anx-dim); font-size: 11px; }
.anx-card-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.anx-card-actions .anx-btn { height: 40px; padding: 0 18px; }
.anx-eyebrow { font-weight: 700; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--anx-accent); }
.anx-card--fail .anx-eyebrow { color: var(--anx-red); }
.anx-toast { position: absolute; left: 50%; top: 62px; transform: translate(-50%, -8px); padding: 8px 14px; border-radius: 999px; background: rgba(26, 15, 15, .92); border: 1px solid var(--anx-line-2); font-weight: 600; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.anx-toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.anx-toast.is-detail { width: max-content; max-width: min(560px, calc(100% - 32px)); white-space: normal; text-align: center; line-height: 1.45; border-radius: 12px; }
.anx-nogl .anx-gl { cursor: default; }

/* --------------------------------------------------------------- cluster */
.anx-cluster { flex: none; padding: 10px 16px 6px; background: linear-gradient(180deg, var(--anx-panel), var(--anx-bg)); border-top: 1px solid var(--anx-line); }
.anx-dials { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 14px; align-items: center; max-width: 760px; margin: 0 auto; }
.anx-dial { width: 100%; height: auto; aspect-ratio: 1; display: block; max-height: 200px; justify-self: center; }
.anx-dial--main { max-height: 232px; }
.anx-tells { display: flex; justify-content: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.anx-tells li { padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--anx-dim); border: 1px solid var(--anx-line); background: var(--anx-panel); }
.anx-tells li.is-on { color: var(--anx-accent); border-color: rgba(202, 38, 49, .5); background: rgba(202, 38, 49, .1); }
.anx-tells li.is-warn { color: var(--anx-red); border-color: rgba(255, 77, 90, .6); background: rgba(255, 77, 90, .12); }

/* ------------------------------------------------------------------ deck */
.anx-deck { flex: none; display: grid; grid-template-columns: 2.3fr 1.2fr 1.4fr; gap: 20px; padding: 10px 18px 16px; background: var(--anx-panel); border-top: 1px solid var(--anx-line); }
.anx-deck .anx-row:first-child { margin-top: 0; }
.anx-big { font-size: 20px !important; color: var(--anx-accent) !important; }
.anx-pedals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.anx-pedal { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: 9px; border: 1px solid var(--anx-line-2); background: linear-gradient(180deg, var(--anx-panel-2), var(--anx-panel)); color: var(--anx-text); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
.anx-pedal:hover { border-color: var(--anx-accent); }
.anx-pedal.is-down { background: rgba(202, 38, 49, .2); border-color: var(--anx-accent); transform: translateY(1px); }
.anx-pedal:nth-child(2).is-down { background: rgba(255, 77, 90, .22); border-color: var(--anx-red); }
.anx-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 34px; margin-top: 10px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--anx-line-2); background: var(--anx-panel-2); color: var(--anx-muted); font-weight: 600; font-size: 12px; cursor: pointer; }
.anx-toggle i { position: relative; width: 30px; height: 16px; border-radius: 8px; background: var(--anx-line-2); transition: background .15s; }
.anx-toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.anx-toggle.is-on { color: var(--anx-text); } .anx-toggle.is-on i { background: var(--anx-accent); } .anx-toggle.is-on i::after { transform: translateX(14px); }
.anx-link { border: 0; background: none; color: var(--anx-accent); font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; }
.anx-gearbox { display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; margin-top: 8px; }
.anx-gearbox .anx-btn { height: 46px; width: 100%; }
.anx-gear { display: grid; place-items: center; height: 46px; border-radius: 9px; border: 1px solid var(--anx-line-2); background: #050505; font-weight: 700; font-size: 26px; color: var(--anx-accent); text-shadow: 0 0 14px rgba(202, 38, 49, .5); }
.anx-pips { display: flex; gap: 4px; margin-top: 8px; }
.anx-pips i { flex: 1; text-align: center; font-size: 10px; font-weight: 700; padding: 3px 0; border-radius: 5px; background: var(--anx-panel-2); color: var(--anx-dim); }
.anx-pips i.is-on { background: rgba(202, 38, 49, .18); color: var(--anx-accent); }

/* ---------------------------------------------------------- right panel */
.anx-t3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
.anx-t3 div { padding: 8px 6px; border: 1px solid var(--anx-line); border-radius: 9px; text-align: center; background: var(--anx-panel-2); }
.anx-t3 span { display: block; font-size: 10px; letter-spacing: .06em; color: var(--anx-dim); font-weight: 600; text-transform: uppercase; }
.anx-t3 b { display: block; font-size: 14px; margin-top: 2px; }
.anx-chart { display: block; width: 100%; height: auto; aspect-ratio: 340 / 190; margin-top: 8px; }
.anx-chart[data-ref="pv"] { aspect-ratio: 340 / 220; }
.anx-peaks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.anx-peaks div { padding: 7px 9px; border: 1px solid var(--anx-line); border-radius: 9px; background: var(--anx-panel-2); }
.anx-peaks span { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--anx-dim); font-weight: 600; }
.anx-peaks b { font-size: 12px; }
.anx-peaks div:first-child b { color: var(--anx-amber); } .anx-peaks div:last-child b { color: var(--anx-accent); }
.anx-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.anx-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: currentColor; }
.anx-legend .c1 { color: var(--anx-accent); } .anx-legend .c2 { color: var(--anx-amber); } .anx-legend .c3 { color: #ff6a4d; } .anx-legend .c4 { color: #a88587; }
.anx-data { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.anx-data div { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 4px; padding: 4px 0; border-bottom: 1px solid #291617; font-size: 12px; }
.anx-data span { color: var(--anx-muted); grid-column: 1 / -1; font-size: 10px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.anx-data b { font-weight: 600; font-size: 13px; text-align: left; }
.anx-data em { color: var(--anx-dim); font-size: 10px; }

/* ---------------------------------------------------------------- dialog */
.anx-dialog { margin: auto; padding: 22px 24px; max-width: 420px; width: calc(100% - 32px); border-radius: 16px; border: 1px solid var(--anx-line-2); background: var(--anx-panel); color: var(--anx-text); }
.anx-dialog::backdrop { background: rgba(9, 4, 4, .7); backdrop-filter: blur(3px); }
.anx-dialog h3 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.anx-dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
.anx-dialog dt { white-space: nowrap; } .anx-dialog dd { color: var(--anx-muted); }

/* ------------------------------------------------------------ responsive */
@container anx (max-width: 1180px) {
  .anx-app { height: auto; min-height: 0; overflow: visible; }
  .anx-body { grid-template-columns: 1fr 1fr; grid-template-areas: "c c" "l r"; }
  .anx-center { grid-area: c; } .anx-left { grid-area: l; border-right: 1px solid var(--anx-line); } .anx-right { grid-area: r; }
  .anx-side { overflow: visible; }
  .anx-viewport { flex: none; height: clamp(340px, 52vw, 520px); }
}
@container anx (max-width: 760px) {
  .anx-body { grid-template-columns: 1fr; grid-template-areas: "c" "l" "r"; }
  .anx-left, .anx-right { border: 0; border-top: 1px solid var(--anx-line); }
  .anx-head { padding: 10px 12px; gap: 10px; }
  .anx-actions { width: 100%; margin-left: 0; }
  .anx-actions .anx-go, .anx-actions .anx-stop { flex: 1; }
  .anx-status { order: 3; }
  .anx-deck { grid-template-columns: 1fr; gap: 14px; padding: 12px 14px 16px; }
  .anx-engchip { max-width: 100%; }
  .anx-shift { display: none; }

    on(R.gl, 'pointermove', e => { if (!drag || !view) return; const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY; lastDx = dx; view.orbit(-dx * .008, dy * .006); });
    ['pointerup', 'pointercancel'].forEach(ev => on(R.gl, ev, () => { if (!drag) return; drag = false; if (view) { view.dragging(false); view.fling(-lastDx * .0012); } }));
    on(R.gl, 'wheel', e => { if (view && (e.ctrlKey || e.metaKey)) { e.preventDefault(); view.zoomBy(Math.exp(e.deltaY * .0015)); } }, { passive: false }); }
  // dialog + fullscreen
  const openHelp = () => { if (R.dlg.showModal) { if (!R.dlg.open) R.dlg.showModal(); } else R.dlg.setAttribute('open', ''); };
  on(R.help, 'click', openHelp); on(R.dlgClose, 'click', () => { if (R.dlg.close) R.dlg.close(); else R.dlg.removeAttribute('open'); });
  const fsEl = host.requestFullscreen ? host : null;
  if (!fsEl) R.full.hidden = true;
  const toggleFS = () => { if (!fsEl) return; if (document.fullscreenElement) document.exitFullscreen(); else fsEl.requestFullscreen().catch(() => {}); };
  on(R.full, 'click', () => { toggleFS(); R.full.blur(); });

  /* ---------- RESET EVERYTHING ---------- */
  function resetAll() {
    state = 0; msg = 'OFF'; dyn = null; hist.length = 0; rpm = 0; v = 0; gear = 0; cd = 0; thr = 0; uThr = 0; uLoad = 0; key = 0; gas = 0; brk = 0; cp = 0; knk = 0; cut = 0; bst = 0; ca = 0; cav = 0; fuel = 60;
    arm = 0; l60 = l100 = 0; setText(R.t0, '-'); setText(R.t60, '-'); setText(R.t100, '-'); R.lt.textContent = 'Arm launch';
    R.thr.value = 0; R.ld.value = 0; paint(R.thr); paint(R.ld); setAuto(true); setAutoGearbox(false); setTS(1); setPV(1);
    slow = 1; host.querySelectorAll('[data-slow]').forEach(c => c.classList.toggle('is-on', c.dataset.slow === '1'));
    setAmb(20); Tc = Tamb; setVol(70); setMute(false); setSound(1);
    setEngine(startEngine, true);
    if (view) { view.setView('iso'); view.setAutoOrbit(o.autoOrbit); R.orbit.classList.toggle('is-on', o.autoOrbit); }
    everStarted = false; store.clear(); toast('All inputs reset to defaults'); emit('reset', {});
  }
  on(R.reset, 'click', e => { resetAll(); e.currentTarget.blur(); });

  /* ---------- keyboard ---------- */
  let engaged = o.keyboard === 'always';
  if (o.keyboard === 'engaged') {
    on(host, 'pointerdown', () => { engaged = true; }); on(host, 'focusin', () => { engaged = true; });
    on(document, 'pointerdown', e => { if (!host.contains(e.target)) engaged = false; }, true);
  }
  const typing = () => { const a = document.activeElement; if (!a || !host.contains(a)) return false; return a.tagName === 'SELECT' || a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'range') || a.tagName === 'DIALOG'; };
  on(document, 'keydown', e => {
    if (o.keyboard === 'off' || !engaged || e.ctrlKey || e.metaKey || e.altKey || typing()) return;
    const a = document.activeElement, onRange = a && a.tagName === 'INPUT' && a.type === 'range', c = e.code;
    if (onRange && (c === 'ArrowLeft' || c === 'ArrowRight')) return;
    if (KEYS.thr.indexOf(c) >= 0) { key = 1; e.preventDefault(); }
    else if (KEYS.brk.indexOf(c) >= 0) { brk = 1; e.preventDefault(); }
    else if (c === 'Space' || c === 'KeyC') { cp = 1; e.preventDefault(); }
    else if (c === 'ArrowUp') { if (!e.repeat) sh(1); e.preventDefault(); }
    else if (c === 'ArrowDown') { if (!e.repeat) sh(-1); e.preventDefault(); }
    else if (/^(?:Digit|Numpad)[1-6]$/.test(c)) { if (!e.repeat) selectGear(Number(c.slice(-1))); e.preventDefault(); } else if (/^(?:Digit|Numpad)7$/.test(c)) { if (!e.repeat) selectGear(-1); e.preventDefault(); } else if (c === 'KeyE') { if (!e.repeat) { eKeyHeld = 1; if (state === 0) start(); else stop(); } e.preventDefault(); }
    else if (c === 'KeyN') setNeutral();
    else if (c === 'KeyM') setMute(!muted); else if (c === 'KeyR') resetAll(); else if (c === 'KeyF') toggleFS();
    else if (e.key === '?' || c === 'KeyH') openHelp();
  });
  on(document, 'keyup', e => { const c = e.code; if (KEYS.thr.indexOf(c) >= 0) key = 0; if (KEYS.brk.indexOf(c) >= 0) brk = 0; if (c === 'Space' || c === 'KeyC') cp = 0; if (c === 'KeyE') releaseEngineKey(); });
  on(global, 'blur', () => { key = 0; brk = 0; cp = 0; gas = 0; releaseEngineKey(); });

  /* ---------- gauges + charts ---------- */
  const gT = createGauge(R.dT), gR = createGauge(R.dR), gS = createGauge(R.dS);
  const strokeEls = Array.from(R.strokes.children), tellEls = {}; R.tells.querySelectorAll('li').forEach(li => { tellEls[li.dataset.t] = li; });
  let lastStatus = '', peaks = null;

  /* ---------- sizing / visibility ---------- */
  const ratio = () => Math.min(2, global.devicePixelRatio || 1);
  function resize() { if (view) view.resize(R.vp.clientWidth, R.vp.clientHeight, ratio()); else { const r = ratio(); R.gl.width = Math.max(2, R.vp.clientWidth * r | 0); R.gl.height = Math.max(2, R.vp.clientHeight * r | 0); } dynoDirty = true; }
  let ro = null;
  if (global.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(R.vp); ro.observe(R.dc); }
  resize();
  let visible = true, alive = true, raf = 0, last = performance.now();
  const wake = () => { if (!alive || raf) return; if (visible && !document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); audio.resume(); } };
  const sleep = () => { audio.suspend(); };

  if (global.IntersectionObserver) { io = new IntersectionObserver(es => { visible = es[0].isIntersecting; visible ? wake() : sleep(); }, { threshold: 0 }); io.observe(host); }
  on(document, 'visibilitychange', () => { document.hidden ? sleep() : wake(); });

  /* ====================================================================== *
   * FRAME
   * ====================================================================== */
  const fmt1 = n => n.toFixed(1);
  function frame(now) {
    raf = 0; if (!alive) return;
    if (!visible || document.hidden) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (dyn && state != 2) dyn = null;
    for (let i = 0; i < 8; i++) step(dt / 8);
    const g = E, w = rpm * PI / 30, kw = (sig.brake || 0) * w / 1000, te = sig.te || 0, f = rpm / g.rl;
    T += dt; ca = (ca + rpm * 6 * dt) % 720; cav = (cav + rpm * 6 * dt * slow) % 720; thermal(dt);
    const lh = Math.max(0, (sig.ind || 0)) * w / 1000 / (g.dsl ? .4 * 9.97 : .3 * 8.8) + (state == 2 ? .4 * g.disp / 5 : 0);
    if (state == 2) fuel = Math.max(0, fuel - lh / 3600 * dt * 3);
    const egt = Tamb + 250 + (state == 2 ? 550 * (sig.tq || 0) * (.4 + .6 * f) + 80 * f : 0), bm = (sig.brake || 0) * 4 * PI / (g.disp * 1e-3) / 1e5;
    const kmh = Math.abs(v) * 3.6;

    // ----- status / overlay -----
    const kind = state == 2 ? 'run' : state == 1 ? 'crank' : msg == 'OFF' ? 'off' : 'fail';
    if (kind !== lastStatus) {
      lastStatus = kind; R.status.dataset.s = kind;
      emit('state', { state: kind, message: msg });
      if (kind === 'fail') { emit('fail', { message: msg }); toast('Engine stopped: ' + msg, 6500, true); }
      if (kind === 'run' || kind === 'fail') R.vp.dataset.s = kind; else R.vp.dataset.s = kind;
    }
    setText(R.statusText, kind === 'run' ? 'Running' : kind === 'crank' ? 'Cranking' : kind === 'off' ? 'Engine off' : msg.split(':')[0]);
    if (kind === 'fail') setOverlay('', '', '');
    else if (kind === 'off' && !everStarted) setOverlay('intro', '', ''); else setOverlay('', '', '');
    R.start.disabled = state == 1;

    // ----- text readouts -----
    setText(R.tv, Math.round(thr * 100) + '%'); setText(R.lv, Math.round(uLoad * 100) + '%'); setText(R.gear, gear < 0 ? 'R' : gear || 'N');
    if (R.pips._c !== gear) { R.pips._c = gear; Array.from(R.pips.children).forEach(c => c.classList.toggle('is-on', +c.dataset.g === gear)); }
    setText(R.tk, fuel.toFixed(1) + ' L'); R.tkBar.style.width = Math.min(100, fuel / 60 * 100) + '%'; toggleCls(R.tkBar, 'is-low', fuel < 8);
    const zn = ZONE(); setText(R.zone, zn[0]); R.zone.dataset.z = zn[1];
    const S = (k, t) => setText(SX[k], t);
    S('hp', fmt1(kw * 1.341)); S('kw', fmt1(kw)); S('br', Math.round(sig.brake || 0) + ''); S('ind', Math.round(sig.ind || 0) + ''); S('bm', bm.toFixed(2)); S('map', (g.dsl ? 1 + 1.2 * te : .35 + .65 * te).toFixed(2)); S('exh', (1.05 + .3 * te).toFixed(2));
    S('pu', ((sig.pump || 0) * 4 * PI / (g.disp * 1e-3) / 1e5).toFixed(2)); S('ct', Tc.toFixed(0)); S('iat', (Tamb + (Tc - Tamb) * .15).toFixed(0)); S('egt', Math.round(egt)); S('th', Math.round(thr * 100)); S('cr', Math.round(ca) + '');
    S('tk', fuel.toFixed(1)); S('lh', lh.toFixed(1)); S('rg', lh > .1 ? (fuel / lh).toFixed(1) : '-'); S('rl', g.dsl ? Math.round(500 + 1300 * (.4 + .6 * f)) + '' : '3.0'); S('inj', Math.round(te * (.3 + .7 * f) * 100) + ''); S('am', Tamb + ''); S('bo', g.tb ? Math.round(bst * 100) + '' : '-');
    // launch timer
    if (arm == 1 && v > .1) { arm = 2; t0 = T; }
    if (arm == 2) { if (!l60 && kmh >= 60) { l60 = T - t0; setText(R.t60, l60.toFixed(1) + ' s'); } if (!l100 && kmh >= 100) { l100 = T - t0; setText(R.t100, l100.toFixed(1) + ' s'); arm = 0; } setText(R.t0, (T - t0).toFixed(1) + ' s'); }
    setText(R.lt, arm == 1 ? 'Armed: waiting for movement' : arm == 2 ? 'Timing...' : 'Arm launch');
    // dyno
    if (dyn) { dyn.r += dt * (g.rl - g.idle) / 9; hist.push([rpm, sig.brake, kw]); dynoDirty = true; if (dyn.r >= g.rl - 1) { dyn = null; emit('dyno', peaks); } }

    // ----- telltales + shift lights -----
    toggleCls(tellEls.temp, 'is-warn', Tc > 100); toggleCls(tellEls.fuel, 'is-warn', fuel < 8); toggleCls(tellEls.lim, 'is-warn', !!cut && state == 2); toggleCls(tellEls.knock, 'is-warn', knk > .5);
    toggleCls(tellEls.boost, 'is-on', !!g.tb && bst > .15); toggleCls(tellEls.clutch, 'is-on', !!cp);
    const lit = state == 2 ? Math.round(clamp((f - .62) / .36, 0, 1) * LEDS.length) : 0, flash = cut && state == 2 ? (Math.floor(T * 14) & 1) + 2 : 0, lk = lit + ':' + flash;
    if (lk !== ledOn) { ledOn = lk; LEDS.forEach((l, i) => { l.classList.toggle('on', flash ? flash == 3 : i < lit); }); }

    // ----- audio params -----
    audio.post({ rpm, tq: sig.tq || 0, thr: Math.max(thr, te), on: state == 2 ? 1 : 0, st: state == 1 ? 1 : 0, vs: kmh, bst, cd: clamp((80 - Tc) / 80, 0, 1), ms: g.ms * Math.sqrt(700 / (egt + 273)), ld: uLoad, ta: Math.sqrt((Tamb + 273) / 293) });

    // ----- instruments -----
    if (kmh > spMax * .94) spMax += 50;
    const rmax = Math.ceil(g.rl * 1.12 / 1000) * 1000;
    gR.draw({ val: rpm, smooth: !!autoGearbox, max: rmax, minor: rmax > 9000 ? 500 : 200, major: 1000, red: g.rl, label: 'RPM x1000', unit: 'rpm', txt: Math.round(rpm), sub: gear < 0 ? 'R' : gear ? 'G' + gear : 'N', fmt: q => q / 1000, key: 'r' + g.rl, t: T }, PAL);
    gS.draw({ val: kmh, smooth: !!autoGearbox, max: spMax, minor: 10, major: spMax > 260 ? 50 : 20, red: 0, label: 'SPEED', unit: 'km/h', txt: Math.round(kmh), key: 's', t: T }, PAL);
    gT.draw({ val: Tc, max: 140, minor: 5, major: 20, red: 106, label: 'COOLANT', unit: '°C', txt: Math.round(Tc), key: 'c', t: T }, PAL);
    const ph = (cav - E.fo[0] + 1440) % 720, tpv = (ph + 360) % 720, sidx = strokeOfT(tpv);
    strokeEls.forEach((s, i) => toggleCls(s, 'is-on', i === sidx));
    const pvx = fitCanvas(R.pv, 340, 220); drawPV(pvx, { E, te, tq: sig.tq || 0, live: state == 2, mode: pvm, t: tpv }, PAL);
    if (dynoDirty) {
      dynoDirty = false; const dx = fitCanvas(R.dc, 340, 190);
      const pk = drawDyno(dx, { E, hist, tqK: 1, tqUnit: 'Nm', live: !!dyn, rpm }, PAL);
      if (pk) { peaks = { hp: pk.hp.v, hpRpm: pk.hp.rpm, tq: pk.tq.v, tqRpm: pk.tq.rpm }; setText(R.pkP, Math.round(pk.hp.v) + ' hp @ ' + Math.round(pk.hp.rpm)); setText(R.pkT, Math.round(pk.tq.v) + ' Nm @ ' + Math.round(pk.tq.rpm)); }
    }
    // ----- 3D -----
    const tqn = sig.tq || 0;
    if (view) view.draw({ dt, ca: cav, rpm, state, tq: tqn, thr: Math.max(thr, te) });
    else if (cutCtx) { const cx = fitCanvas(R.gl, R.gl.clientWidth || 600, R.gl.clientHeight || 400); const fo0 = E.fo[0]; drawCutaway(cx, { E, ph: (cav - fo0 + 1440) % 720, look: [.3, .75, 1, .12 + .4 * tqn * (state == 2 && ph < 120 ? 1 : 0)] }, PAL); }
  }

  /* ---------- go ---------- */
  setAmb(init.ambient); Tc = Tamb; setVol(init.volume); setSound(init.sound); setMute(false); setTS(1); paint(R.thr); paint(R.ld);
  setEngine(init.engine, true);
  wake();
  emit('ready', { version: VERSION, engine: engKey });

  const api = {
    start, stop, reset: resetAll, setEngine: k => setEngine(k), setAmbient: x => setAmb(clamp(+x, -40, 55)), setVolume: setVol, mute: setMute,
    on(n, fn) { (listeners[n] = listeners[n] || []).push(fn); return () => { listeners[n] = (listeners[n] || []).filter(f => f !== fn); }; },
    getState() { return { engine: engKey, state: ['off', 'cranking', 'running'][state], message: msg, rpm, speedKmh: v * 3.6, gear, coolantC: Tc, fuelL: fuel, ambientC: Tamb }; },
    refreshTheme() { PAL = readPalette(); gT.invalidate(); gR.invalidate(); gS.invalidate(); },
    destroy() {
      alive = false; cancelAnimationFrame(raf); raf = 0; off.forEach(f => { try { f(); } catch (e) {} }); if (ro) ro.disconnect(); if (io) io.disconnect();
      audio.close(); if (view) view.dispose(); clearTimeout(toastT); host.innerHTML = ''; host.classList.remove('anx-sim'); delete host._anx;
    }
  };
  host._anx = api;
  return api;
}

/* ========================================================================== *
 * 7. BOOTSTRAP
 * ========================================================================== */
function mountAll(root) {
  return Array.prototype.map.call((root || document).querySelectorAll('[data-autonexus-engine-simulator]'), el => mount(el));
}
global.AutonexusEngineSimulator = {
  version: VERSION, mount, mountAll,
  get engines() { return JSON.parse(JSON.stringify(ENG)); },
  get workletSource() { return DSP_SRC + '\n' + WORKLET_REG; }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => mountAll()); else mountAll();
})(typeof window !== 'undefined' ? window : this);
</script>
